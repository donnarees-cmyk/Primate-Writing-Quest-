<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Primate Writing Quest</title><style>
:root{--ink:#173153;--blue:#2563eb;--purple:#7045cd;--mint:#d8f9e9;--gold:#f6bd38;--bg:#e9f4ff;--white:#fff;--red:#a72b49}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:linear-gradient(145deg,#d6edff,#f6e9ff 60%,#fff8d4);line-height:1.55}button,textarea,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #ffaf32;outline-offset:3px}header{background:#172f60;color:white;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}header strong{font-size:1.18rem}.mini{font-size:.85rem;opacity:.9}.shell{max-width:920px;margin:18px auto;padding:0 14px 36px}.bar{height:15px;background:#fff;border:2px solid #b3d1ee;border-radius:30px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#13bdb9,#8a5eed);width:0;transition:width .35s}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800;margin:8px 0 14px}.card{background:#fff;border:2px solid #d5e0f5;box-shadow:0 6px 0 #cad9ed;border-radius:23px;padding:clamp(16px,4vw,30px);margin:16px 0}.hero{background:linear-gradient(115deg,#2b61cb,#7749bd);color:#fff;border:0}.hero h1{font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.1;margin:8px 0}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-weight:900;font-size:.83rem}.stage{display:inline-block;background:#e8edff;color:#33267b;border-radius:30px;padding:5px 13px;font-weight:900}h2{font-size:1.65rem;line-height:1.2;margin:15px 0 9px}h3{margin:18px 0 8px}.lead{font-size:1.13rem}.btn{background:#2259d5;color:#fff;border:0;border-radius:13px;padding:13px 20px;font-weight:850;min-height:47px}.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#eee8ff;color:#34276e}.orange{background:#f59b21;color:#2b244b}.green{background:#087b5b}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.talk{background:#e5f7ff;color:#1a5284;border:2px solid #b6e5fd}.source{border-left:7px solid #58a9d7;background:#f0f8ff;padding:13px 17px;border-radius:10px;margin:12px 0;font-size:1.07rem}.source b{display:block;margin-bottom:4px}.options{display:grid;gap:11px;margin:20px 0}.choice{text-align:left;background:#f4f6ff;color:var(--ink);padding:14px;border:2px solid #cbd8ee;border-radius:14px;font-weight:680;min-height:54px}.choice:hover{border-color:#5156d8;background:#eef2ff}.choice.selected{background:#e3ecff;border-color:#234cc1}.choice:disabled{cursor:default}.note{background:#fff5d7;border-left:6px solid var(--gold);padding:12px 15px;border-radius:8px;margin:13px 0}.feedback{padding:14px 17px;border-radius:14px;font-weight:700;margin:15px 0}.success{background:#d6f6e5;border:2px solid #63bd8b}.retry{background:#fff0ce;border:2px solid #e8b255}.incorrect{background:#ffe7e9;border:2px solid #e18f9c}.pill{display:inline-flex;border-radius:30px;background:#f5e2ff;color:#623692;padding:4px 11px;font-weight:800}.lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.tile{background:#f2f5ff;border-radius:14px;padding:13px;border:1px solid #d9e1fa}.tile b{display:block;color:#5135af}.prompt{background:#f0ecff;border-radius:15px;padding:16px;border:2px solid #d8c7ff}.field{width:100%;border:2px solid #b1c8e2;border-radius:12px;padding:12px;min-height:105px;resize:vertical;background:#fcfeff;color:#173153}.field-small{min-height:70px}.count{font-size:.86rem;color:#52657c;text-align:right}.checklist label{display:block;margin:9px 0;padding:10px;background:#f3f8ff;border-radius:9px}.checklist input{width:20px;height:20px;vertical-align:middle}.screen-reader{position:absolute;left:-9999px}.hidden{display:none!important}.end-score{font-size:3rem;font-weight:950;color:#255bc6}.foot{font-size:.81rem;color:#536781;text-align:center;margin-top:25px}@media(max-width:500px){.card{padding:16px}.row .btn{flex:1}.btn{padding:12px}header{align-items:flex-start}}@media print{header,.bar,.btn,.stats{display:none!important}body{background:white}.card{box-shadow:none;border:1px solid #888}.shell{max-width:none}}
</style></head><body><header><div><strong>🐒 Primate Writing Quest</strong><div class="mini">Primate Writing Quest • ELA.6.C.1.4</div></div><div class="row"><button class="btn talk" id="readBtn" onclick="speakVisible()">🔊 Read this page</button><button class="btn secondary" onclick="stopSpeak()">■ Stop</button></div></header><main class="shell"><div class="stats"><span id="level">Mission 1 of 6</span><span id="points">⭐ 0 points</span><span id="clock">⏱ Suggested: 30 minutes</span></div><div class="bar" role="progressbar" aria-label="Mission progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><div class="fill" id="fill"></div></div><section id="game" aria-live="polite"></section><p class="foot">Original instructional passages • Practice inspired by Florida B.E.S.T. writing expectations • Not an official FAST test. Reading audio works with device voices.</p></main><script>
'use strict';
const steps=['Welcome','Learn the Skill','Read the Sources','Practice Arena','Writing Lab','Mission Report'];let step=0,question=0,selected=null,tries=0,locked=false,score=0,answers=[],student='',started=Date.now();
const sourceA={title:'Source 1 • Jane Goodall Observes Chimpanzees',text:'In 1960, Jane Goodall traveled to Tanzania to study chimpanzees in the wild. She spent many hours watching their behavior. Goodall observed a chimpanzee use a piece of grass to collect termites from a mound. This was important because scientists had believed that only humans made and used tools. Goodall also noticed that chimpanzees form close family bonds and communicate through sounds, faces, and gestures. Her careful notes helped people understand how intelligent and social chimpanzees can be.'};
const sourceB={title:'Source 2 • How Primates Live Together',text:'Primates are mammals that include monkeys, apes, and humans. Many primates live in social groups. Members may groom one another by cleaning their fur. Grooming can help strengthen relationships within a group. Young primates often learn by observing older group members. For example, a young chimpanzee might watch an adult find food and then try the same method. These behaviors can help a primate group cooperate, learn, and survive.'};
const questions=[
{skill:'Central Idea',q:'Which central idea best fits BOTH sources?',options:['Chimpanzees are the only primates that can learn.','Watching and living with others help us understand primate behavior.','All primates live in Tanzania.'],a:1,hint:'Both sources describe how chimpanzees or other primates act, learn, and connect.',why:'Both passages explain primate behavior, learning, and social relationships.'},
{skill:'Find Evidence',q:'Which detail from Source 1 best supports the idea that chimpanzees can solve problems?',options:['Goodall traveled to Tanzania in 1960.','A chimpanzee used grass to collect termites.','Goodall spent hours watching chimpanzees.'],a:1,hint:'A tool is used to complete a task. Look for an example of tool use.',why:'Using grass to get termites is a specific example of problem solving.'},
{skill:'Combine Sources',q:'Which sentence correctly uses information from BOTH sources?',options:['Source 1 says primates live alone, but Source 2 says they live in groups.','Source 1 describes family bonds, and Source 2 explains that grooming builds relationships.','Both sources say every primate makes tools from grass.'],a:1,hint:'Find one correct fact from each passage about relationships.',why:'Family bonds come from Source 1; grooming and relationships come from Source 2.'},
{skill:'Elaborate',q:'Read: “Young primates learn by watching adults.” Which sentence BEST elaborates on this fact?',options:['Young primates are interesting.','This helps young primates practice useful skills, such as finding food.','Primates are mammals.'],a:1,hint:'Elaboration tells HOW or WHY the evidence matters.',why:'The explanation shows why watching adults helps young primates.'},
{skill:'Transitions',q:'Choose the best transition: “Chimpanzees use tools to find food. ____, young primates learn by watching adults.”',options:['For example','In addition','However'],a:1,hint:'The second sentence adds another related fact, not an opposite idea.',why:'“In addition” introduces another supporting point.'},
{skill:'Organization',q:'Which order makes the clearest expository paragraph?',options:['Evidence → ending → topic sentence','Topic sentence → evidence → explanation → closing sentence','Closing sentence → topic sentence → unrelated fact'],a:1,hint:'Tell your main point first, support it, explain it, then wrap up.',why:'A clear paragraph begins with a topic sentence and logically develops the idea.'},
{skill:'Paraphrase',q:'Source 2 says grooming can strengthen relationships. Which is the BEST paraphrase?',options:['Cleaning one another’s fur may help primates build social bonds (Source 2).','Grooming can help strengthen relationships within a group.','Primates only groom to remove dirt.'],a:0,hint:'A paraphrase keeps the meaning but changes the wording and names the source.',why:'It restates the idea in new words and identifies Source 2.'},
{skill:'FAST-Style Revision',q:'Which revision would make this writing stronger? “Primates are cool. Jane saw stuff. They do things.”',options:['Add more opinions about primates.','Add precise facts from both sources and explain how each supports the main idea.','Make every sentence shorter.'],a:1,hint:'Strong expository writing uses facts, multiple sources, and explanations.',why:'Adding relevant evidence and elaboration makes the explanation specific and meaningful.'}
];
const key='primate_quest_draft_v1';let draft={intro:'',body1:'',body2:'',end:''};try{let d=JSON.parse(localStorage.getItem(key));if(d&&typeof d==='object')draft={...draft,...d}}catch(e){}
const $=id=>document.getElementById(id),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel()}
function say(t){stopSpeak();if(!('speechSynthesis' in window)){alert('Speech playback is not available in this browser. Try Safari or Chrome with audio enabled.');return}let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.83;u.pitch=1;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang==='en-US'&&/Google US English/i.test(v.name))||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en'))||null;speechSynthesis.speak(u)}
function speakVisible(){let el=$('game');say(el.innerText.replace(/🔊|▶|⭐|✅|🔐/g,''))}
function listen(id){const e=$(id);if(e)say(e.innerText||e.value)}
function scrollToStart(){window.scrollTo({top:0,behavior:'smooth'})}
function move(s){stopSpeak();step=s;render();scrollToStart()}
function navBtns(nextLabel='Continue →'){return `<div class="row" style="margin-top:20px"><button class="btn" onclick="move(${step+1})">${nextLabel}</button></div>`}
function render(){let p=Math.round(step/5*100);$('fill').style.width=p+'%';$('bar').setAttribute('aria-valuenow',p);$('level').textContent=`Mission ${Math.min(step+1,6)} of 6 · ${steps[step]}`;$('points').textContent=`⭐ ${score} points`;
let s='';if(step===0)s=`<div class="card hero"><div class="eyebrow">🦧 Jungle Writing Adventure</div><h1>Primate Writing Quest!</h1><p class="lead">Unlock the secret to strong expository writing with Jane Goodall and her chimpanzee friends.</p><span class="pill">6 missions • about 30 minutes • audio support</span></div><div class="card"><h2>🎒 Your mission</h2><p>You will read TWO short sources, answer practice questions, and write about what primates can teach us. You can listen to every screen. If you miss a question, you get a helpful clue and one more try!</p><label for="name"><b>Explorer name (optional)</b></label><input id="name" maxlength="50" placeholder="First name" style="display:block;padding:12px;border-radius:9px;border:2px solid #a1bee2;width:min(100%,350px)" value="${escapeHTML(student)}" oninput="student=this.value"><div class="note">⏳ Mission map: Learn (4 min) · Read (5 min) · Play (9 min) · Write (10 min) · Review (2 min)</div><button class="btn orange" onclick="move(1)">🚀 Start Adventure</button></div>`;
if(step===1)s=`<div class="card"><span class="stage">Mission 1 · Learn · 4 minutes</span><h2>🧠 What is expository writing?</h2><p class="lead"><b>Expository writing explains a topic using facts.</b> It teaches the reader, instead of telling an imaginary story or trying to win an argument.</p><div class="lesson-grid"><div class="tile"><b>🎯 1. Central idea</b>Tell the main thing you will explain.</div><div class="tile"><b>📚 2. Evidence</b>Use true information from TWO sources.</div><div class="tile"><b>💡 3. Elaborate</b>Explain what the fact shows or why it matters.</div><div class="tile"><b>🔗 4. Transitions</b>Link ideas with “for example,” “also,” or “as a result.”</div></div><h3>Try the writing formula</h3><div class="prompt"><b>Point → Proof → Explain</b><p>Point: Chimpanzees can solve problems.</p><p>Proof: In Source 1, a chimpanzee uses grass to collect termites.</p><p>Explain: This shows that chimpanzees can use objects as tools to find food.</p></div><div class="note">🗝️ Big idea: Good writing does NOT just drop in a fact. It tells what the fact means.</div><button class="btn talk" onclick="listen('model')">🔊 Hear a model paragraph</button><p id="model" class="source">Chimpanzees are clever animals that can solve problems. According to Source 1, Jane Goodall saw a chimpanzee use grass to collect termites. This example shows that chimpanzees can use simple tools to get food. As a result, Goodall's discovery changed what people understood about animals.</p>${navBtns('📚 Read the Sources →')}</div>`;
if(step===2)s=`<div class="card"><span class="stage">Mission 2 · Reading Camp · 5 minutes</span><h2>📖 Two sources, one big question</h2><div class="prompt"><b>Guiding question:</b> How do chimpanzees and other primates show intelligence and social behavior?</div><p>Read or listen. You can replay the passages as many times as you need.</p>${[sourceA,sourceB].map((a,i)=>`<div class="source" id="src${i}"><b>${a.title}</b><p>${a.text}</p></div><button class="btn talk" onclick="listen('src${i}')">🔊 Listen to Source ${i+1}</button>`).join('')}<div class="note">🔎 Words to know: <b>observe</b> = watch carefully; <b>primate</b> = a mammal such as a monkey, ape, or human; <b>groom</b> = clean another animal’s fur; <b>evidence</b> = facts that support an idea.</div>${navBtns('🎮 Enter Practice Arena →')}</div>`;
if(step===3){let q=questions[question];s=`<div class="card"><span class="stage">Mission 3 · Practice Arena · 9 minutes</span><h2>🎮 Challenge ${question+1} of ${questions.length}</h2><span class="pill">${q.skill}</span><div class="prompt"><p class="lead" id="questionText"><b>${q.q}</b></p><button class="btn talk" onclick="listen('questionText')">🔊 Read question</button></div><div class="options" role="group" aria-label="Answer options">${q.options.map((a,i)=>`<button class="choice ${selected===i?'selected':''}" ${locked?'disabled':''} onclick="pick(${i})"><b>${'ABC'[i]}.</b> ${a}</button>`).join('')}</div><div id="feedback" aria-live="assertive"></div><div class="row"><button class="btn green" id="check" onclick="check()" ${locked||selected===null?'disabled':''}>✅ Check Answer</button><button class="btn secondary" onclick="move(2)">📖 Review Sources</button>${locked?`<button class="btn orange" onclick="nextQuestion()">${question===questions.length-1?'✍️ Start Writing Lab':'Next Challenge →'}</button>`:''}</div><p class="mini">First correct answer: 10 points · Correct on second chance: 5 points · You can try each question twice.</p></div>`;}
if(step===4)s=`<div class="card"><span class="stage">Mission 4 · Writing Lab · 10 minutes</span><h2>✍️ Build your FAST-style expository response</h2><div class="prompt"><b>Practice writing prompt:</b><p>Using information from BOTH sources, write an expository response explaining how primates show intelligence and build relationships. Use facts from Source 1 and Source 2, organize your ideas, explain your evidence, and use transitions.</p><button class="btn talk" onclick="listen('writingDirections')">🔊 Read writing directions</button><p id="writingDirections">Explain how primates show intelligence and build relationships. Use evidence from both sources. Write an introduction, body paragraphs, and a conclusion.</p></div><details><summary><b>📚 Open sources while you write (tap here)</b></summary>${[sourceA,sourceB].map((a,i)=>`<div class="source" id="writeSrc${i}"><b>${a.title}</b><p>${a.text}</p><button class="btn talk" onclick="listen('writeSrc${i}')">🔊 Listen</button></div>`).join('')}</details><div class="note">🛠️ Help is allowed! Use sentence starters if you need them, but add your OWN thinking. Source ideas should be paraphrased and credited.</div>${field('intro','1. Introduction · Tell the main idea','Chimpanzees and other primates show intelligence and build relationships in several ways.','Start with: “Primates show intelligence and social skills by ...”')}${field('body1','2. Body paragraph · Evidence from Source 1','For example, Source 1 explains that Jane Goodall saw a chimpanzee use grass to collect termites. This shows ...','Use: “According to Source 1, ... This matters because ...”')}${field('body2','3. Body paragraph · Evidence from Source 2','In addition, Source 2 describes how primates groom one another. This helps ...','Use: “Source 2 explains ... This suggests ...”')}${field('end','4. Conclusion · Wrap up the explanation','Overall, primates use their abilities to solve problems, learn, and stay connected.','Use: “Together, these examples show ...”')}<h3>✅ Self-check before finishing</h3><div class="checklist">${['I explained a clear central idea.','I used a fact from Source 1 and named the source.','I used a fact from Source 2 and named the source.','I explained WHY each fact matters.','I used transitions and wrote a conclusion.'].map(t=>`<label><input type="checkbox"> ${t}</label>`).join('')}</div><div class="row"><button class="btn talk" onclick="readEssay()">🔊 Read my writing</button><button class="btn secondary" onclick="downloadEssay()">⬇ Save my writing (.txt)</button><button class="btn green" onclick="move(5)">🏆 Finish Mission →</button></div><p class="mini">Your writing is saved in this browser as you type, when storage is available. The game cannot fairly grade writing quality automatically; your teacher can review it.</p></div>`;
if(step===5){let words=Object.values(draft).join(' ').trim().split(/\s+/).filter(Boolean).length;let checks=[['Central idea',draft.intro.trim().length>=35],['Source 1',/source\s*1|goodall/i.test(draft.body1)],['Source 2',/source\s*2|groom|learn/i.test(draft.body2)],['Elaboration',/because|shows|means|helps|suggests|matters/i.test(draft.body1+' '+draft.body2)],['Transitions',/for example|in addition|also|furthermore|as a result|however|finally|overall/i.test(Object.values(draft).join(' '))],['Conclusion',draft.end.trim().length>=25]];s=`<div class="card"><span class="stage">Mission 5 · Report · 2 minutes</span><h2>🏆 Quest Complete, ${escapeHTML(student.trim()||'Explorer')}!</h2><p class="lead">You practiced reading sources, choosing evidence, elaborating, and writing an explanation.</p><div class="end-score">⭐ ${score} / 80</div><p><b>Practice questions:</b> ${answers.filter(a=>a.correct).length} of 8 answered correctly within two tries · <b>Writing:</b> ${words} words</p><h3>🔎 Writing readiness check</h3><p class="mini">These are automatic presence checks, NOT a grade for accuracy or writing quality.</p>${checks.map(([label,ok])=>`<div class="tile" style="margin:7px 0">${ok?'✅':'📝'} ${label} ${ok?'— detected':'— check your draft'}</div>`).join('')}<div class="note">Teacher tip: Review whether the evidence is accurate, paraphrased, cited, clearly explained, and organized. A computerized word check cannot judge those skills reliably.</div><div class="row"><button class="btn" onclick="downloadReport()">⬇ Download results + writing</button><button class="btn secondary" onclick="window.print()">🖨 Print screen</button><button class="btn talk" onclick="move(4)">✍️ Improve my writing</button></div><div class="source"><b>My writing:</b>${Object.values(draft).map(t=>`<p>${escapeHTML(t||'(not written yet)')}</p>`).join('')}</div><button class="btn orange" onclick="restart()">↻ Start over</button></div>`;}
$('game').innerHTML=s;if(step===3&&feedbackCache)showLockedFeedback();}
function pick(i){if(locked)return;selected=i;render()}
function check(){if(selected===null||locked)return;let q=questions[question],right=selected===q.a;if(right){score+=tries===0?10:5;locked=true;answers[question]={correct:true,tries:tries+1};render();showFeedback('success',`🎉 Correct! ${q.why} +${tries===0?10:5} points`);return}tries++;if(tries===1){selected=null;render();showFeedback('retry',`🔍 Not quite. Hint: ${q.hint} Try one more time!`)}else{locked=true;answers[question]={correct:false,tries:2};render();showFeedback('incorrect',`✅ Learning moment: The correct answer is ${'ABC'[q.a]}. ${q.options[q.a]} ${q.why}`)}}
let feedbackCache='';function showFeedback(cls,message){feedbackCache=[cls,message];let e=$('feedback');if(e){e.className='feedback '+cls;e.textContent=message;say(message)}}function showLockedFeedback(){if(feedbackCache){let e=$('feedback');if(e){e.className='feedback '+feedbackCache[0];e.textContent=feedbackCache[1]}}}
function nextQuestion(){question++;selected=null;tries=0;locked=false;feedbackCache='';if(question===questions.length)move(4);else{render();scrollToStart()}}
function field(id,label,model,hint){return `<div style="margin:20px 0"><label for="${id}"><b>${label}</b></label><p class="mini">💡 ${hint}</p><textarea class="field" id="${id}" oninput="saveField('${id}',this.value)" placeholder="Write your own sentences here...">${escapeHTML(draft[id])}</textarea><div class="row" style="margin-top:8px"><button class="btn talk" onclick="say(draft['${id}']||'Nothing written yet')">🔊 Listen to mine</button><button class="btn secondary" onclick="say(${JSON.stringify(model)})">💡 Hear an example</button></div><div class="count" id="cnt${id}">${draft[id].trim().split(/\s+/).filter(Boolean).length} words</div></div>`}
function saveField(id,v){draft[id]=v;try{localStorage.setItem(key,JSON.stringify(draft))}catch(e){}let n=$('cnt'+id);if(n)n.textContent=v.trim().split(/\s+/).filter(Boolean).length+' words'}
function readEssay(){say(Object.values(draft).filter(Boolean).join('. ')||'Write something first.')}
function file(content,name){let blob=new Blob([content],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function downloadEssay(){file(Object.values(draft).join('\n\n'),'primate-expository-writing.txt')}
function downloadReport(){file(`PRIMATE WRITING QUEST\nStudent: ${student||'Explorer'}\nStandard: ELA.6.C.1.4\nPractice score: ${score}/80\nCorrect within two attempts: ${answers.filter(x=>x.correct).length}/8\nDate: ${new Date().toLocaleDateString()}\n\nWRITING\n\n${Object.values(draft).join('\n\n')}\n\nTeacher review needed: writing is not automatically scored for quality.`, 'primate-writing-quest-report.txt')}
function restart(){if(!confirm('Start over? Your saved writing will also be cleared.'))return;try{localStorage.removeItem(key)}catch(e){}draft={intro:'',body1:'',body2:'',end:''};step=0;question=0;selected=null;tries=0;locked=false;score=0;answers=[];feedbackCache='';started=Date.now();render()}
render();
</script></body></html>
